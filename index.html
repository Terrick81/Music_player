<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101113">
  <title>Библиотека СВА</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101113;
      --text: #f5f5f5;
      --muted: #9b9da3;
      --accent: #c7f477;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 0 0 calc(100px + env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% -10%, #30313b 0, transparent 48%),
        var(--bg);
      color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus:not(:focus-visible) {
      outline: none;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      width: min(100% - 36px, 820px);
      margin: 0 auto;
      padding-top: max(28px, env(safe-area-inset-top));
    }

    /* Обложка, название и количество треков — сверху вниз */
    .playlist-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 32px;
    }

    .cover {
      width: min(72vw, 280px);
      aspect-ratio: 1;
      flex: 0 0 auto;
      border-radius: 20px;
      object-fit: cover;
      background: linear-gradient(135deg, #6658bd, #e58b66);
      box-shadow: 0 18px 55px #0008;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.06;
      letter-spacing: -.04em;
      overflow-wrap: anywhere;
    }

    .track-count {
      margin-top: -8px;
      color: var(--muted);
      font-size: 14px;
    }

    .year-heading {
      margin: 30px 0 10px;
      font-size: 22px;
      letter-spacing: -.03em;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 70px;
      padding: 9px 12px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }

    .track:hover {
      background: #ffffff0a;
    }

    .track:active {
      transform: scale(.99);
    }

    .track-cover {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 11px;
      object-fit: cover;
      background: linear-gradient(135deg, #343444, #755b65);
    }

    .track-info {
      min-width: 0;
      flex: 1;
    }

    .track-title {
      display: block;
      overflow: hidden;
      font-size: 15px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-duration {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .message {
      margin: 22px 0;
      color: var(--muted);
    }

    /* Нижний мини-плеер */
    .mini-player {
      position: fixed;
      z-index: 5;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      left: 12px;
      width: min(560px, calc(100% - 24px));
      margin: 0 auto;
      padding: 12px 14px 19px;
      border: 1px solid #ffffff14;
      border-radius: 20px;
      background: rgb(31 32 35 / 96%);
      box-shadow: 0 16px 48px #0009;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .mini-inner {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }

    .mini-cover {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      object-fit: cover;
      background: linear-gradient(135deg, #343444, #755b65);
    }

    .mini-details {
      min-width: 0;
      cursor: pointer;
    }

    .mini-title {
      overflow: hidden;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-time {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .mini-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .transport-button,
    .play-button {
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      cursor: pointer;
    }

    .transport-button {
      width: 36px;
      height: 40px;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
    }

    .transport-button svg {
      width: 19px;
      height: 19px;
    }

    .play-button {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #151711;
      transition: transform .15s ease;
    }

    .play-button:active {
      transform: scale(.93);
    }

    .play-button svg {
      width: 20px;
      height: 20px;
    }

    .progress {
      position: absolute;
      right: 14px;
      bottom: 6px;
      left: 14px;
      width: calc(100% - 28px);
      height: 4px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
    }

    .progress::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 99px;
      background: #ffffff27;
    }

    .progress::-moz-range-track {
      height: 3px;
      border-radius: 99px;
      background: #ffffff27;
    }

    .progress::-webkit-slider-thumb {
      width: 9px;
      height: 9px;
      margin-top: -3px;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
    }

    .progress::-moz-range-thumb {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
    }

    /* Полноэкранный экран плеера */
    .player-screen {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      overflow-y: auto;
      padding:
        max(18px, env(safe-area-inset-top))
        20px
        calc(28px + env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% 0%, #333343 0, transparent 48%),
        #101113;
    }

    .player-screen.open {
      display: block;
    }

    .player-content {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .screen-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .screen-top button,
    .video-toggle {
      padding: 10px 15px;
      border: 1px solid #ffffff14;
      border-radius: 24px;
      background: #ffffff0c;
      cursor: pointer;
    }

    .screen-top button:active,
    .video-toggle:active {
      background: #ffffff1a;
    }

    .now-playing {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
    }

    .big-cover {
      display: block;
      width: min(74vw, 350px);
      aspect-ratio: 1;
      margin: 18px auto 24px;
      border-radius: 23px;
      object-fit: cover;
      background: linear-gradient(135deg, #6658bd, #e58b66);
      box-shadow: 0 24px 70px #0009;
    }

    .full-title {
      margin: 0;
      text-align: center;
      font-size: clamp(25px, 6vw, 38px);
      line-height: 1.15;
      letter-spacing: -.035em;
    }

    .full-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin: 25px 0;
    }

    .full-controls .play-button {
      width: 62px;
      height: 62px;
      flex-basis: 62px;
    }

    .full-controls .play-button svg {
      width: 25px;
      height: 25px;
    }

    .video-toggle {
      display: block;
      margin: 0 auto 18px;
    }

    .video-wrap {
      display: none;
      margin: 0 auto 22px;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    .video-wrap.visible {
      display: block;
    }

    .video-wrap video {
      display: block;
      width: 100%;
      max-height: 52vh;
      background: #000;
    }

    @media (min-width: 700px) {
      .page {
        padding-top: 42px;
      }

      .playlist-header {
        margin-bottom: 42px;
      }

      .track:hover {
        transform: translateX(2px);
      }

      .mini-player {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="playlist-header">
      <img class="cover" id="cover" alt="Обложка библиотеки">
      <h1 id="playlist-title">Библиотека СВА</h1>
      <div class="track-count" id="track-count"></div>
    </header>

    <section id="track-list" aria-label="Список треков"></section>
    <p class="message" id="message"></p>
  </main>

  <audio id="audio" preload="metadata"></audio>

  <aside class="mini-player" id="mini-player" hidden>
    <div class="mini-inner">
      <img class="mini-cover" id="mini-cover" alt="">

      <div
        class="mini-details"
        id="open-player"
        role="button"
        tabindex="0"
        aria-label="Открыть экран плеера"
      >
        <div class="mini-title" id="mini-title"></div>
        <div class="mini-time" id="mini-time">0:00 / 0:00</div>
      </div>

      <div class="mini-controls">
        <button
          class="transport-button"
          id="previous-track"
          type="button"
          aria-label="Предыдущий трек"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12.798 4.025a.33.33 0 0 0-.342.016L7.503 7.332V4.318a.33.33 0 0 0-.176-.293.33.33 0 0 0-.342.016l-5.54 3.681a.33.33 0 0 0-.15.278c0 .106.05.212.15.278l5.54 3.681c.11.074.24.071.342.016a.33.33 0 0 0 .176-.293V8.668l4.953 3.291c.11.074.24.071.341.016a.33.33 0 0 0 .176-.293V4.318a.33.33 0 0 0-.176-.293"
            ></path>
          </svg>
        </button>

        <button
          class="play-button"
          id="mini-play"
          type="button"
          aria-label="Воспроизвести"
        ></button>
      </div>
    </div>

    <input
      class="progress"
      id="progress"
      type="range"
      min="0"
      max="1000"
      value="0"
      aria-label="Позиция воспроизведения"
    >
  </aside>

  <section class="player-screen" id="player-screen" aria-label="Плеер">
    <div class="player-content">
      <div class="screen-top">
        <button id="close-player" type="button">↓ Закрыть</button>
        <span class="now-playing">СЕЙЧАС ИГРАЕТ</span>
        <span aria-hidden="true" style="width:75px"></span>
      </div>

      <img class="big-cover" id="big-cover" alt="Обложка трека">
      <h2 class="full-title" id="full-title"></h2>

      <div class="full-controls">
        <button
          class="transport-button"
          id="full-previous"
          type="button"
          aria-label="Предыдущий трек"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12.798 4.025a.33.33 0 0 0-.342.016L7.503 7.332V4.318a.33.33 0 0 0-.176-.293.33.33 0 0 0-.342.016l-5.54 3.681a.33.33 0 0 0-.15.278c0 .106.05.212.15.278l5.54 3.681c.11.074.24.071.342.016a.33.33 0 0 0 .176-.293V8.668l4.953 3.291c.11.074.24.071.341.016a.33.33 0 0 0 .176-.293V4.318a.33.33 0 0 0-.176-.293"
            ></path>
          </svg>
        </button>

        <button
          class="play-button"
          id="full-play"
          type="button"
          aria-label="Воспроизвести"
        ></button>

        <button
          class="transport-button"
          id="next-track"
          type="button"
          aria-label="Следующий трек"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M3.202 4.025a.33.33 0 0 1 .342.016l4.953 3.291V4.318a.33.33 0 0 1 .176-.293.33.33 0 0 1 .342.016l5.54 3.681a.33.33 0 0 1 .15.278c0 .106-.05.212-.15.278l-5.54 3.681a.33.33 0 0 1-.342.016.33.33 0 0 1-.176-.293V8.668l-4.953 3.291a.33.33 0 0 1-.341.016.33.33 0 0 1-.176-.293V4.318a.33.33 0 0 1 .176-.293"
            ></path>
          </svg>
        </button>
      </div>

      <button class="video-toggle" id="video-toggle" type="button" hidden>
        ▶ Смотреть клип
      </button>

      <div class="video-wrap" id="video-wrap">
        <video id="video" controls playsinline preload="metadata"></video>
      </div>
    </div>
  </section>

  <script>
    const audio = document.querySelector("#audio");
    const video = document.querySelector("#video");
    const miniPlayer = document.querySelector("#mini-player");
    const playerScreen = document.querySelector("#player-screen");

    let playlist = null;
    let currentTrack = null;

    const $ = (selector) => document.querySelector(selector);

    const playIcon = `
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path
          fill="currentColor"
          d="M6 4.9c0-.7.8-1.1 1.4-.7l9 5.1a.8.8 0 0 1 0 1.4l-9 5.1c-.6.4-1.4 0-1.4-.7V4.9Z"
        ></path>
      </svg>
    `;

    const pauseIcon = `
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path
          fill="currentColor"
          d="M8.25 3.09v13.82a.415.415 0 0 1-.417.416H4.81a.415.415 0 0 1-.417-.416V3.09a.415.415 0 0 1 .417-.416h3.023a.415.415 0 0 1 .416.416m7.358 0v13.82a.415.415 0 0 1-.417.416h-3.022a.416.416 0 0 1-.417-.416V3.09a.415.415 0 0 1 .417-.416h3.022a.415.415 0 0 1 .417.416"
        ></path>
      </svg>
    `;

    function setImage(img, path) {
      if (!img) return;

      if (!path) {
        img.removeAttribute("src");
        return;
      }

      img.onerror = () => {
        console.warn("Не найдена обложка:", path);
        img.removeAttribute("src");
      };

      img.src = new URL(path, document.baseURI).href;
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const remainder = Math.floor(seconds % 60).toString().padStart(2, "0");

      return `${minutes}:${remainder}`;
    }

    function loadTrackDuration(track, element) {
      if (!track.audio) {
        element.textContent = "--:--";
        return;
      }

      const probe = new Audio();
      probe.preload = "metadata";

      probe.addEventListener("loadedmetadata", () => {
        element.textContent = formatTime(probe.duration);
        probe.removeAttribute("src");
      }, { once: true });

      probe.addEventListener("error", () => {
        element.textContent = "--:--";
      }, { once: true });

      probe.src = new URL(track.audio, document.baseURI).href;
      probe.load();
    }

    function setPlayButtons(playing) {
      const icon = playing ? pauseIcon : playIcon;

      $("#mini-play").innerHTML = icon;
      $("#full-play").innerHTML = icon;

      $("#mini-play").setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");
      $("#full-play").setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");
    }

    function renderPlaylist(data) {
      if (!data || !Array.isArray(data.tracks)) {
        throw new Error("В playlist.json не найден массив tracks.");
      }

      playlist = data;

      // Название фиксировано по запросу.
      document.title = "Библиотека СВА";
      $("#playlist-title").textContent = "Библиотека СВА";
      $("#track-count").textContent =
        `${data.tracks.length} ${data.tracks.length === 1 ? "трек" : "треков"}`;

      setImage($("#cover"), data.cover);

      const groups = new Map();

      for (const track of data.tracks) {
        const year = track.year ? String(track.year) : "Без года";

        if (!groups.has(year)) {
          groups.set(year, []);
        }

        groups.get(year).push(track);
      }

      const years = [...groups.keys()].sort((a, b) => {
        if (a === "Без года") return 1;
        if (b === "Без года") return -1;
        return Number(b) - Number(a);
      });

      const list = $("#track-list");
      list.replaceChildren();

      for (const year of years) {
        const heading = document.createElement("h2");
        heading.className = "year-heading";
        heading.textContent = year;
        list.append(heading);

        for (const track of groups.get(year)) {
          const row = document.createElement("button");
          row.className = "track";
          row.type = "button";

          const trackCover = document.createElement("img");
          trackCover.className = "track-cover";
          trackCover.alt = "";
          setImage(trackCover, track.cover || data.cover);

          const info = document.createElement("span");
          info.className = "track-info";

          const trackTitle = document.createElement("span");
          trackTitle.className = "track-title";
          trackTitle.textContent = track.title || "Без названия";

          const duration = document.createElement("span");
          duration.className = "track-duration";
          duration.textContent = "…";

          info.append(trackTitle);
          row.append(trackCover, info, duration);

          row.addEventListener("click", () => selectTrack(track));
          list.append(row);

          loadTrackDuration(track, duration);
        }
      }

      if (data.tracks.length === 0) {
        $("#message").textContent = "В библиотеке пока нет треков.";
      } else {
        $("#message").textContent = "";
      }
    }

    function selectTrack(track) {
      currentTrack = track;

      audio.pause();
      video.pause();
      video.removeAttribute("src");
      video.load();
      $("#video-wrap").classList.remove("visible");

      audio.src = track.audio;
      audio.load();

      const title = track.title || "Без названия";
      const coverPath = track.cover || playlist.cover;

      $("#mini-title").textContent = title;
      $("#full-title").textContent = title;

      setImage($("#mini-cover"), coverPath);
      setImage($("#big-cover"), coverPath);

      $("#video-toggle").hidden = !track.video;
      miniPlayer.hidden = false;
      $("#mini-time").textContent = "0:00 / 0:00";
      $("#progress").value = 0;

      audio.play()
        .then(() => setPlayButtons(true))
        .catch((error) => {
          console.warn("Воспроизведение не запустилось:", error);
          setPlayButtons(false);
        });
    }

    function togglePlayback() {
      if (!currentTrack) return;

      const videoVisible = $("#video-wrap").classList.contains("visible");

      if (videoVisible && video.src) {
        if (video.paused) {
          audio.pause();
          video.play().catch(() => {});
        } else {
          video.pause();
        }
        return;
      }

      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    }

    function changeTrack(direction) {
      if (!currentTrack || !playlist?.tracks?.length) return;

      const currentIndex = playlist.tracks.indexOf(currentTrack);
      const nextIndex =
        (currentIndex + direction + playlist.tracks.length) % playlist.tracks.length;

      selectTrack(playlist.tracks[nextIndex]);
    }

    $("#mini-play").addEventListener("click", togglePlayback);
    $("#full-play").addEventListener("click", togglePlayback);

    $("#previous-track").addEventListener("click", () => changeTrack(-1));
    $("#full-previous").addEventListener("click", () => changeTrack(-1));
    $("#next-track").addEventListener("click", () => changeTrack(1));

    $("#open-player").addEventListener("click", () => {
      if (currentTrack) playerScreen.classList.add("open");
    });

    $("#open-player").addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        if (currentTrack) playerScreen.classList.add("open");
      }
    });

    $("#close-player").addEventListener("click", () => {
      playerScreen.classList.remove("open");
      video.pause();
    });

    $("#video-toggle").addEventListener("click", () => {
      if (!currentTrack?.video) return;

      audio.pause();
      video.src = currentTrack.video;
      video.load();
      $("#video-wrap").classList.add("visible");

      video.play().catch((error) => {
        console.warn("Видео не запустилось:", error);
      });

      $("#video-wrap").scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    });

    audio.addEventListener("play", () => setPlayButtons(true));
    audio.addEventListener("pause", () => setPlayButtons(false));

    audio.addEventListener("ended", () => {
      if (playlist?.tracks?.length) {
        changeTrack(1);
      } else {
        setPlayButtons(false);
      }
    });

    video.addEventListener("play", () => setPlayButtons(true));
    video.addEventListener("pause", () => {
      if (video.paused && audio.paused) {
        setPlayButtons(false);
      }
    });

    audio.addEventListener("timeupdate", () => {
      const duration = audio.duration || 0;
      const current = audio.currentTime || 0;

      $("#mini-time").textContent =
        `${formatTime(current)} / ${formatTime(duration)}`;

      if (duration) {
        $("#progress").value = Math.round(current / duration * 1000);
      }
    });

    $("#progress").addEventListener("input", (event) => {
      if (audio.duration) {
        audio.currentTime = Number(event.target.value) / 1000 * audio.duration;
      }
    });

    fetch("playlist.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) {
          throw new Error(
            `Не удалось загрузить playlist.json (HTTP ${response.status}).`
          );
        }

        return response.json();
      })
      .then(renderPlaylist)
      .catch((error) => {
        console.error(error);
        $("#playlist-title").textContent = "Библиотека СВА";
        $("#message").textContent =
          `${error.message} Проверь, что playlist.json находится рядом с index.html и содержит корректный JSON.`;
      });
  </script>
