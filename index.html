<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101113">
  <title>Библиотека СВА</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101113;
      --text: #f5f5f5;
      --muted: #9b9da3;
      --subtle: #777b83;
      --accent: #c7f477;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 0 0 calc(116px + env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% -10%, #30313b 0, transparent 48%),
        var(--bg);
      color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus:not(:focus-visible) {
      outline: none;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      width: min(100% - 36px, 820px);
      margin: 0 auto;
      padding-top: max(28px, env(safe-area-inset-top));
    }

    .playlist-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 17px;
      margin-bottom: 38px;
      text-align: center;
    }

    .cover {
      display: block;
      width: min(72vw, 280px);
      aspect-ratio: 1;
      border-radius: 22px;
      object-fit: cover;
      background: linear-gradient(135deg, #6658bd, #e58b66);
      box-shadow: 0 18px 55px #0008;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.06;
      letter-spacing: -.04em;
      overflow-wrap: anywhere;
    }

    .year-heading {
      margin: 30px 0 8px;
      color: var(--subtle);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 70px;
      padding: 9px 12px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }

    .track:hover {
      background: #ffffff0a;
    }

    .track:active {
      transform: scale(.99);
    }

    .track-cover {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 11px;
      object-fit: cover;
      background: linear-gradient(135deg, #343444, #755b65);
    }

    .track-info {
      min-width: 0;
      flex: 1;
    }

    .track-title {
      display: block;
      overflow: hidden;
      font-size: 15px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-duration {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .message {
      margin: 22px 0;
      color: var(--muted);
    }

    /* Таймлайны: заполненная часть обновляется из JavaScript */
    .timeline {
      display: block;
      width: 100%;
      height: 16px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 99px;
      background:
        linear-gradient(
          to right,
          var(--accent) 0%,
          var(--accent) var(--progress, 0%),
          #ffffff2c var(--progress, 0%),
          #ffffff2c 100%
        );
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 3px;
      cursor: pointer;
      touch-action: pan-y;
    }

    .timeline::-webkit-slider-runnable-track {
      height: 16px;
      background: transparent;
    }

    .timeline::-moz-range-track {
      height: 16px;
      background: transparent;
    }

    .timeline::-webkit-slider-thumb {
      width: 10px;
      height: 10px;
      margin-top: 3px;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px #c7f47720;
    }

    .timeline::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px #c7f47720;
    }

    /* Нижняя панель */
    .mini-player {
      position: fixed;
      z-index: 5;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      left: 12px;
      width: min(660px, calc(100% - 24px));
      margin: 0 auto;
      padding: 8px 14px 12px;
      border: 1px solid #ffffff14;
      border-radius: 20px;
      background: rgb(31 32 35 / 96%);
      box-shadow: 0 16px 48px #0009;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .mini-timeline {
      height: 14px;
      margin-bottom: 7px;
    }

    .mini-inner {
      display: grid;
      grid-template-columns: 42px minmax(60px, 1fr) auto;
      align-items: center;
      gap: 9px;
    }

    .mini-cover {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      background: linear-gradient(135deg, #343444, #755b65);
    }

    .mini-details {
      min-width: 0;
      cursor: pointer;
    }

    .mini-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-time {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .mini-controls {
      display: flex;
      align-items: center;
      gap: 1px;
    }

    .transport-button,
    .play-button,
    .shuffle-button {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      border: 0;
      cursor: pointer;
    }

    .transport-button {
      width: 34px;
      height: 38px;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
    }

    .transport-button svg {
      width: 18px;
      height: 18px;
    }

    .shuffle-button {
      width: 34px;
      height: 38px;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      transition: color .18s ease, background .18s ease;
    }

    .shuffle-button svg {
      width: 18px;
      height: 18px;
    }

    .shuffle-button.active {
      color: var(--accent);
      background: #c7f47718;
    }

    .play-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: #151711;
      transition: transform .15s ease;
    }

    .play-button:active {
      transform: scale(.93);
    }

    .play-button svg {
      width: 19px;
      height: 19px;
    }

    /* Экран отдельного трека */
    .player-screen {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      overflow-y: auto;
      padding:
        max(18px, env(safe-area-inset-top))
        20px
        calc(28px + env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% 0%, #333343 0, transparent 48%),
        #101113;
    }

    .player-screen.open {
      display: block;
    }

    .player-content {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .screen-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .close-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      padding: 0;
      border: 1px solid #ffffff18;
      border-radius: 50%;
      background: #ffffff0d;
      color: var(--text);
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }

    .close-button:hover {
      background: #ffffff18;
    }

    .close-button:active {
      transform: scale(.94);
    }

    .close-button svg {
      width: 19px;
      height: 19px;
    }

    .now-playing {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
    }

    .top-spacer {
      width: 42px;
      height: 42px;
    }

    .big-cover {
      display: block;
      width: min(74vw, 350px);
      aspect-ratio: 1;
      margin: 18px auto 24px;
      border-radius: 23px;
      object-fit: cover;
      background: linear-gradient(135deg, #6658bd, #e58b66);
      box-shadow: 0 24px 70px #0009;
    }

    .full-title {
      margin: 0;
      text-align: center;
      font-size: clamp(25px, 6vw, 38px);
      line-height: 1.15;
      letter-spacing: -.035em;
    }

    .full-time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .full-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 17px 0 25px;
    }

    .full-controls .transport-button {
      width: 42px;
      height: 42px;
    }

    .full-controls .play-button {
      width: 62px;
      height: 62px;
    }

    .full-controls .play-button svg {
      width: 25px;
      height: 25px;
    }

    .full-controls .shuffle-button {
      width: 42px;
      height: 42px;
      margin-left: 4px;
    }

    .video-toggle {
      display: block;
      margin: 0 auto 18px;
      padding: 10px 15px;
      border: 1px solid #ffffff14;
      border-radius: 24px;
      background: #ffffff0c;
      cursor: pointer;
    }

    .video-wrap {
      display: none;
      margin: 0 auto 22px;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    .video-wrap.visible {
      display: block;
    }

    .video-wrap video {
      display: block;
      width: 100%;
      max-height: 52vh;
      background: #000;
    }

    @media (max-width: 410px) {
      .mini-player {
        right: 8px;
        left: 8px;
        width: calc(100% - 16px);
        padding-right: 8px;
        padding-left: 8px;
      }

      .mini-inner {
        grid-template-columns: 36px minmax(42px, 1fr) auto;
        gap: 6px;
      }

      .mini-cover {
        width: 36px;
        height: 36px;
      }

      .mini-title {
        font-size: 12px;
      }

      .mini-controls {
        gap: 0;
      }

      .transport-button,
      .shuffle-button {
        width: 29px;
      }

      .play-button {
        width: 35px;
        height: 35px;
      }
    }

    @media (min-width: 700px) {
      .page {
        padding-top: 42px;
      }

      .playlist-header {
        margin-bottom: 42px;
      }

      .track:hover {
        transform: translateX(2px);
      }

      .mini-player {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="playlist-header">
      <img class="cover" id="cover" alt="Обложка библиотеки">
      <h1 id="playlist-title">Библиотека СВА</h1>
    </header>

    <section id="track-list" aria-label="Список треков"></section>
    <p class="message" id="message"></p>
  </main>

  <audio id="audio" preload="metadata"></audio>

  <aside class="mini-player" id="mini-player" hidden>
    <input
      class="timeline mini-timeline"
      id="mini-progress"
      type="range"
      min="0"
      max="1000"
      value="0"
      aria-label="Позиция воспроизведения"
    >

    <div class="mini-inner">
      <img class="mini-cover" id="mini-cover" alt="">

      <div
        class="mini-details"
        id="open-player"
        role="button"
        tabindex="0"
        aria-label="Открыть экран плеера"
      >
        <div class="mini-title" id="mini-title"></div>
        <div class="mini-time" id="mini-time">0:00 / --:--</div>
      </div>

      <div class="mini-controls">
        <button class="shuffle-button" id="mini-shuffle" type="button"
                aria-label="Перемешать треки" aria-pressed="false"
                title="Перемешать треки">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"
              stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>

        <button class="transport-button" id="previous-track" type="button"
                aria-label="Предыдущий трек" title="Предыдущий трек">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M12.798 4.025a.33.33 0 0 0-.342.016L7.503 7.332V4.318a.33.33 0 0 0-.176-.293.33.33 0 0 0-.342.016l-5.54 3.681a.33.33 0 0 0-.15.278c0 .106.05.212.15.278l5.54 3.681c.11.074.24.071.342.016a.33.33 0 0 0 .176-.293V8.668l4.953 3.291c.11.074.24.071.341.016a.33.33 0 0 0 .176-.293V4.318a.33.33 0 0 0-.176-.293"></path>
          </svg>
        </button>

        <button class="play-button" id="mini-play" type="button"
                aria-label="Воспроизвести"></button>

        <button class="transport-button" id="next-track" type="button"
                aria-label="Следующий трек" title="Следующий трек">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M3.202 4.025a.33.33 0 0 1 .342.016l4.953 3.291V4.318a.33.33 0 0 1 .176-.293.33.33 0 0 1 .342.016l5.54 3.681a.33.33 0 0 1 .15.278c0 .106-.05.212-.15.278l-5.54 3.681a.33.33 0 0 1-.342.016.33.33 0 0 1-.176-.293V8.668l-4.953 3.291a.33.33 0 0 1-.341.016.33.33 0 0 1-.176-.293V4.318a.33.33 0 0 1 .176-.293"></path>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <section class="player-screen" id="player-screen" aria-label="Плеер">
    <div class="player-content">
      <div class="screen-top">
        <button class="close-button" id="close-player" type="button"
                aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
        </button>

        <span class="now-playing">СЕЙЧАС ИГРАЕТ</span>
        <span class="top-spacer" aria-hidden="true"></span>
      </div>

      <img class="big-cover" id="big-cover" alt="Обложка трека">
      <h2 class="full-title" id="full-title"></h2>

      <div class="full-time-row">
        <span id="full-current-time">0:00</span>
        <span id="full-duration">--:--</span>
      </div>

      <input
        class="timeline full-timeline"
        id="full-progress"
        type="range"
        min="0"
        max="1000"
        value="0"
        aria-label="Позиция воспроизведения"
      >

      <div class="full-controls">
        <button class="transport-button" id="full-previous" type="button"
                aria-label="Предыдущий трек">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M12.798 4.025a.33.33 0 0 0-.342.016L7.503 7.332V4.318a.33.33 0 0 0-.176-.293.33.33 0 0 0-.342.016l-5.54 3.681a.33.33 0 0 0-.15.278c0 .106.05.212.15.278l5.54 3.681c.11.074.24.071.342.016a.33.33 0 0 0 .176-.293V8.668l4.953 3.291c.11.074.24.071.341.016a.33.33 0 0 0 .176-.293V4.318a.33.33 0 0 0-.176-.293"></path>
          </svg>
        </button>

        <button class="play-button" id="full-play" type="button"
                aria-label="Воспроизвести"></button>

        <button class="transport-button" id="full-next" type="button"
                aria-label="Следующий трек">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M3.202 4.025a.33.33 0 0 1 .342.016l4.953 3.291V4.318a.33.33 0 0 1 .176-.293.33.33 0 0 1 .342.016l5.54 3.681a.33.33 0 0 1 .15.278c0 .106-.05.212-.15.278l-5.54 3.681a.33.33 0 0 1-.342.016.33.33 0 0 1-.176-.293V8.668l-4.953 3.291a.33.33 0 0 1-.341.016.33.33 0 0 1-.176-.293V4.318a.33.33 0 0 1 .176-.293"></path>
          </svg>
        </button>

        <button class="shuffle-button" id="full-shuffle" type="button"
                aria-label="Перемешать треки" aria-pressed="false"
                title="Перемешать треки">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"
              stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>

      <button class="video-toggle" id="video-toggle" type="button" hidden>
        ▶ Смотреть клип
      </button>

      <div class="video-wrap" id="video-wrap">
        <video id="video" controls playsinline preload="metadata"></video>
      </div>
    </div>
  </section>

  <script>
    const audio = document.querySelector("#audio");
    const video = document.querySelector("#video");
    const miniPlayer = document.querySelector("#mini-player");
    const playerScreen = document.querySelector("#player-screen");

    let playlist = null;
    let currentTrack = null;
    let playQueue = [];
    let queueIndex = -1;
    let shuffleEnabled = false;

    const $ = (selector) => document.querySelector(selector);

    const playIcon = `
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path fill="currentColor"
          d="M6 4.9c0-.7.8-1.1 1.4-.7l9 5.1a.8.8 0 0 1 0 1.4l-9 5.1c-.6.4-1.4 0-1.4-.7V4.9Z"></path>
      </svg>`;

    const pauseIcon = `
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path fill="currentColor"
          d="M8.25 3.09v13.82a.415.415 0 0 1-.417.416H4.81a.415.415 0 0 1-.417-.416V3.09a.415.415 0 0 1 .417-.416h3.023a.415.415 0 0 1 .416.416m7.358 0v13.82a.415.415 0 0 1-.417.416h-3.022a.416.416 0 0 1-.417-.416V3.09a.415.415 0 0 1 .417-.416h3.022a.415.415 0 0 1 .417.416"></path>
      </svg>`;

    function setImage(img, path) {
      if (!img) return;

      if (!path) {
        img.removeAttribute("src");
        return;
      }

      img.onerror = () => {
        console.warn("Не найдена обложка:", path);
        img.removeAttribute("src");
      };

      img.src = new URL(path, document.baseURI).href;
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const remainder = Math.floor(seconds % 60).toString().padStart(2, "0");

      return `${minutes}:${remainder}`;
    }

    function parseDuration(value) {
      if (typeof value === "number" && Number.isFinite(value) && value >= 0) {
        return value;
      }

      if (typeof value !== "string" || !value.trim()) return null;

      const parts = value.trim().split(":").map(Number);

      if (parts.some((part) => !Number.isFinite(part) || part < 0)) {
        return null;
      }

      if (parts.length === 2) {
        return parts[0] * 60 + parts[1];
      }

      if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      }

      return null;
    }

    function displayDuration(value) {
      if (typeof value === "string" && value.trim()) return value.trim();

      const seconds = parseDuration(value);
      return seconds === null ? "--:--" : formatTime(seconds);
    }

    function getTrackDurationSeconds() {
      const jsonDuration = parseDuration(currentTrack?.duration);
      if (jsonDuration !== null) return jsonDuration;

      return Number.isFinite(audio.duration) ? audio.duration : null;
    }

    function updateTimeline(input, current, duration) {
      const percent = duration > 0
        ? Math.max(0, Math.min(100, current / duration * 100))
        : 0;

      input.value = String(Math.round(percent * 10));
      input.style.setProperty("--progress", `${percent}%`);
    }

    function setPlayButtons(playing) {
      const icon = playing ? pauseIcon : playIcon;

      $("#mini-play").innerHTML = icon;
      $("#full-play").innerHTML = icon;
      $("#mini-play").setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");
      $("#full-play").setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");

      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = playing ? "playing" : "paused";
      }
    }

    function shuffleTracks(tracks) {
      const result = [...tracks];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function updateShuffleButtons() {
      for (const button of [$("#mini-shuffle"), $("#full-shuffle")]) {
        button.classList.toggle("active", shuffleEnabled);
        button.setAttribute("aria-pressed", String(shuffleEnabled));
        button.setAttribute(
          "aria-label",
          shuffleEnabled ? "Выключить перемешивание" : "Перемешать треки"
        );
        button.title = shuffleEnabled
          ? "Выключить перемешивание"
          : "Перемешать треки";
      }
    }

    function setQueueForSelectedTrack(track) {
      if (!playlist?.tracks?.length) return;

      if (shuffleEnabled) {
        playQueue = [
          track,
          ...shuffleTracks(playlist.tracks.filter((item) => item !== track))
        ];
        queueIndex = 0;
      } else {
        playQueue = [...playlist.tracks];
        queueIndex = playQueue.indexOf(track);
      }
    }

    function updateMediaSession(track) {
      if (!("mediaSession" in navigator) || !track) return;

      const artworkPath = track.cover || playlist?.cover;
      const artworkUrl = artworkPath
        ? new URL(artworkPath, document.baseURI).href
        : "";

      const artwork = artworkUrl
        ? [
            { src: artworkUrl, sizes: "96x96", type: "image/jpeg" },
            { src: artworkUrl, sizes: "192x192", type: "image/jpeg" },
            { src: artworkUrl, sizes: "512x512", type: "image/jpeg" }
          ]
        : [];

      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title || "Без названия",
          album: "Библиотека СВА",
          artwork
        });
      } catch (error) {
        console.warn("Не удалось обновить информацию экрана блокировки:", error);
      }

      setMediaSessionAction("play", () => audio.play().catch(() => {}));
      setMediaSessionAction("pause", () => audio.pause());
      setMediaSessionAction("previoustrack", () => changeTrack(-1));
      setMediaSessionAction("nexttrack", () => changeTrack(1));
      setMediaSessionAction("seekbackward", (details) => {
        audio.currentTime = Math.max(
          0,
          audio.currentTime - (details.seekOffset || 10)
        );
      });
      setMediaSessionAction("seekforward", (details) => {
        const duration = getTrackDurationSeconds();
        audio.currentTime = Math.min(
          duration || Infinity,
          audio.currentTime + (details.seekOffset || 10)
        );
      });
      setMediaSessionAction("seekto", (details) => {
        if (Number.isFinite(details.seekTime)) {
          audio.currentTime = details.seekTime;
        }
      });

      updateMediaPosition();
    }

    function setMediaSessionAction(action, handler) {
      if (!("mediaSession" in navigator)) return;

      try {
        navigator.mediaSession.setActionHandler(action, handler);
      } catch {
        // Некоторые браузеры не поддерживают отдельные команды Media Session.
      }
    }

    function updateMediaPosition() {
      if (!("mediaSession" in navigator)) return;

      const duration = getTrackDurationSeconds();
      if (!duration || !Number.isFinite(duration)) return;

      try {
        navigator.mediaSession.setPositionState({
          duration,
          playbackRate: audio.playbackRate || 1,
          position: Math.min(audio.currentTime || 0, duration)
        });
      } catch {
        // Не все браузеры поддерживают отображение позиции трека.
      }
    }

    function renderPlaylist(data) {
      if (!data || !Array.isArray(data.tracks)) {
        throw new Error("В playlist.json не найден массив tracks.");
      }

      playlist = data;
      document.title = "Библиотека СВА";
      $("#playlist-title").textContent = "Библиотека СВА";
      setImage($("#cover"), data.cover);

      const groups = new Map();

      for (const track of data.tracks) {
        const year = track.year ? String(track.year) : "Без года";
        if (!groups.has(year)) groups.set(year, []);
        groups.get(year).push(track);
      }

      const years = [...groups.keys()].sort((a, b) => {
        if (a === "Без года") return 1;
        if (b === "Без года") return -1;
        return Number(b) - Number(a);
      });

      const list = $("#track-list");
      list.replaceChildren();

      for (const year of years) {
        const heading = document.createElement("h2");
        heading.className = "year-heading";
        heading.textContent = year;
        list.append(heading);

        for (const track of groups.get(year)) {
          const row = document.createElement("button");
          row.className = "track";
          row.type = "button";

          const trackCover = document.createElement("img");
          trackCover.className = "track-cover";
          trackCover.alt = "";
          setImage(trackCover, track.cover || data.cover);

          const info = document.createElement("span");
          info.className = "track-info";

          const title = document.createElement("span");
          title.className = "track-title";
          title.textContent = track.title || "Без названия";

          const duration = document.createElement("span");
          duration.className = "track-duration";
          duration.textContent = displayDuration(track.duration);

          info.append(title);
          row.append(trackCover, info, duration);
          row.addEventListener("click", () => selectTrack(track));
          list.append(row);
        }
      }

      $("#message").textContent =
        data.tracks.length === 0 ? "В библиотеке пока нет треков." : "";

      updateShuffleButtons();
    }

    function selectTrack(track, fromQueue = false) {
      if (!track || !track.audio) {
        $("#message").textContent = "У этого трека не указан путь к аудиофайлу.";
        return;
      }

      currentTrack = track;

      if (!fromQueue) {
        setQueueForSelectedTrack(track);
      }

      audio.pause();
      video.pause();
      video.removeAttribute("src");
      video.load();
      $("#video-wrap").classList.remove("visible");

      audio.src = new URL(track.audio, document.baseURI).href;
      audio.load();

      const title = track.title || "Без названия";
      const coverPath = track.cover || playlist.cover;

      $("#mini-title").textContent = title;
      $("#full-title").textContent = title;

      setImage($("#mini-cover"), coverPath);
      setImage($("#big-cover"), coverPath);

      $("#video-toggle").hidden = !track.video;
      miniPlayer.hidden = false;
      $("#mini-time").textContent = `0:00 / ${displayDuration(track.duration)}`;
      $("#full-current-time").textContent = "0:00";
      $("#full-duration").textContent = displayDuration(track.duration);

      updateTimeline($("#mini-progress"), 0, getTrackDurationSeconds());
      updateTimeline($("#full-progress"), 0, getTrackDurationSeconds());
      updateMediaSession(track);

      audio.play()
        .then(() => setPlayButtons(true))
        .catch((error) => {
          console.warn("Воспроизведение не запустилось:", error);
          setPlayButtons(false);
        });
    }

    function togglePlayback() {
      if (!currentTrack) return;

      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    }

    function changeTrack(direction) {
      if (!playQueue.length) return;

      if (queueIndex < 0) {
        queueIndex = 0;
      } else {
        queueIndex = (queueIndex + direction + playQueue.length) % playQueue.length;
      }

      selectTrack(playQueue[queueIndex], true);
    }

    function toggleShuffle() {
      shuffleEnabled = !shuffleEnabled;

      if (playlist?.tracks?.length) {
        if (shuffleEnabled && currentTrack) {
          playQueue = [
            currentTrack,
            ...shuffleTracks(playlist.tracks.filter((track) => track !== currentTrack))
          ];
          queueIndex = 0;
        } else if (shuffleEnabled) {
          playQueue = shuffleTracks(playlist.tracks);
          queueIndex = -1;
        } else {
          playQueue = [...playlist.tracks];
          queueIndex = currentTrack ? playQueue.indexOf(currentTrack) : -1;
        }
      }

      updateShuffleButtons();
    }

    function seekFromSlider(event) {
      const slider = event.currentTarget;
      const duration = getTrackDurationSeconds();

      if (!duration || duration <= 0) return;

      const fraction = Number(slider.value) / 1000;
      audio.currentTime = fraction * duration;
    }

    function updateProgressDisplays() {
      const current = audio.currentTime || 0;
      const duration = getTrackDurationSeconds();

      $("#mini-time").textContent =
        `${formatTime(current)} / ${displayDuration(currentTrack?.duration)}`;
      $("#full-current-time").textContent = formatTime(current);
      $("#full-duration").textContent = displayDuration(currentTrack?.duration);

      updateTimeline($("#mini-progress"), current, duration);
      updateTimeline($("#full-progress"), current, duration);
      updateMediaPosition();
    }

    $("#mini-play").addEventListener("click", togglePlayback);
    $("#full-play").addEventListener("click", togglePlayback);

    $("#previous-track").addEventListener("click", () => changeTrack(-1));
    $("#full-previous").addEventListener("click", () => changeTrack(-1));
    $("#next-track").addEventListener("click", () => changeTrack(1));
    $("#full-next").addEventListener("click", () => changeTrack(1));

    $("#mini-shuffle").addEventListener("click", toggleShuffle);
    $("#full-shuffle").addEventListener("click", toggleShuffle);

    $("#mini-progress").addEventListener("input", seekFromSlider);
    $("#full-progress").addEventListener("input", seekFromSlider);

    $("#open-player").addEventListener("click", () => {
      if (currentTrack) playerScreen.classList.add("open");
    });

    $("#open-player").addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        if (currentTrack) playerScreen.classList.add("open");
      }
    });

    $("#close-player").addEventListener("click", () => {
      playerScreen.classList.remove("open");
      video.pause();
    });

    $("#video-toggle").addEventListener("click", () => {
      if (!currentTrack?.video) return;

      audio.pause();
      video.src = new URL(currentTrack.video, document.baseURI).href;
      video.load();
      $("#video-wrap").classList.add("visible");
      video.play().catch((error) => {
        console.warn("Видео не запустилось:", error);
      });
    });

    audio.addEventListener("play", () => setPlayButtons(true));
    audio.addEventListener("pause", () => setPlayButtons(false));

    audio.addEventListener("loadedmetadata", updateProgressDisplays);
    audio.addEventListener("durationchange", updateProgressDisplays);
    audio.addEventListener("timeupdate", updateProgressDisplays);

    audio.addEventListener("ended", () => {
      if (playQueue.length) {
        changeTrack(1);
      } else {
        setPlayButtons(false);
      }
    });

    video.addEventListener("play", () => {
      audio.pause();
    });

    fetch("playlist.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) {
          throw new Error(
            `Не удалось загрузить playlist.json (HTTP ${response.status}).`
          );
        }

        return response.json();
      })
      .then(renderPlaylist)
