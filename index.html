<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Мой плейлист</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <header class="playlist-header">
      <img class="cover" id="cover" alt="Обложка плейлиста">
      <div>
        <div class="eyebrow">Плейлист</div>
        <h1 id="playlist-title">Загрузка…</h1>
        <div class="track-count" id="track-count"></div>
      </div>
    </header>

    <section id="track-list" aria-label="Список треков"></section>
    <p class="empty" id="error-message"></p>
  </main>

  <audio id="audio" preload="metadata"></audio>

  <aside class="mini-player" id="mini-player" hidden>
    <input class="progress" id="progress" type="range" min="0" max="1000" value="0"
           aria-label="Позиция воспроизведения">
    <div class="mini-inner">
      <div class="mini-details" id="open-player">
        <div class="mini-title" id="mini-title"></div>
        <div class="mini-artist" id="mini-artist"></div>
      </div>
      <button class="play-button" id="mini-play" aria-label="Воспроизвести">▶</button>
    </div>
  </aside>

  <section class="player-screen" id="player-screen" aria-label="Плеер">
    <div class="player-content">
      <div class="screen-top">
        <button id="close-player">↓ Закрыть</button>
        <span class="now-playing">СЕЙЧАС ИГРАЕТ</span>
        <span aria-hidden="true" style="width:75px"></span>
      </div>

      <img class="big-cover" id="big-cover" alt="Обложка плейлиста">
      <h2 class="full-title" id="full-title"></h2>
      <div class="full-artist" id="full-artist"></div>

      <div class="full-controls">
        <button class="play-button" id="full-play" aria-label="Воспроизвести">▶</button>
      </div>

      <button class="video-toggle" id="video-toggle" hidden>▶ Смотреть клип</button>
      <div class="video-wrap" id="video-wrap">
        <video id="video" controls playsinline preload="metadata"></video>
      </div>

      <h3 class="lyrics-heading">Текст песни</h3>
      <div class="lyrics" id="lyrics"></div>
    </div>
  </section>

  <script>
    const audio = document.querySelector("#audio");
    const video = document.querySelector("#video");
    const miniPlayer = document.querySelector("#mini-player");
    const playerScreen = document.querySelector("#player-screen");

    let playlist;
    let currentTrack = null;

    const $ = (selector) => document.querySelector(selector);

    function setPlayButtons(playing) {
      $("#mini-play").textContent = playing ? "Ⅱ" : "▶";
      $("#full-play").textContent = playing ? "Ⅱ" : "▶";
      $("#mini-play").setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");
      $("#full-play").setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");
    }

    function renderPlaylist(data) {
      playlist = data;
      document.title = data.title;
      $("#playlist-title").textContent = data.title;
      $("#cover").src = data.cover;
      $("#big-cover").src = data.cover;
      $("#track-count").textContent =
        `${data.tracks.length} ${data.tracks.length === 1 ? "трек" : "треков"}`;

      const years = [...new Set(data.tracks.map(track => track.year))]
        .sort((a, b) => b - a);

      const list = $("#track-list");
      list.replaceChildren();

      let number = 0;
      for (const year of years) {
        const heading = document.createElement("h2");
        heading.className = "year-heading";
        heading.textContent = year;
        list.append(heading);

        for (const track of data.tracks.filter(item => item.year === year)) {
          number++;
          const row = document.createElement("button");
          row.className = "track";
          row.type = "button";
          row.innerHTML = `
            <span class="track-number">${number}</span>
            <span class="track-info">
              <span class="track-title"></span>
              <span class="track-artist"></span>
            </span>
            ${track.video ? '<span class="video-badge" title="Есть клип" aria-label="Есть клип">▶</span>' : ""}
          `;
          row.querySelector(".track-title").textContent = track.title;
          row.querySelector(".track-artist").textContent = track.artist;
          row.addEventListener("click", () => selectTrack(track));
          list.append(row);
        }
      }
    }

    function selectTrack(track) {
      currentTrack = track;
      video.pause();
      video.removeAttribute("src");
      video.load();
      $("#video-wrap").classList.remove("visible");

      audio.src = track.audio;
      audio.load();

      $("#mini-title").textContent = track.title;
      $("#mini-artist").textContent = track.artist;
      $("#full-title").textContent = track.title;
      $("#full-artist").textContent = track.artist;
      $("#lyrics").textContent = track.lyrics || "Текст песни пока не добавлен.";

      const videoButton = $("#video-toggle");
      videoButton.hidden = !track.video;
      miniPlayer.hidden = false;

      audio.play().then(() => setPlayButtons(true)).catch(() => setPlayButtons(false));
    }

    function toggleAudio() {
      if (!currentTrack) return;
      if (audio.paused) {
        video.pause();
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    }

    $("#mini-play").addEventListener("click", toggleAudio);
    $("#full-play").addEventListener("click", toggleAudio);
    $("#open-player").addEventListener("click", () => {
      if (currentTrack) playerScreen.classList.add("open");
    });
    $("#close-player").addEventListener("click", () => {
      playerScreen.classList.remove("open");
      video.pause();
    });

    $("#video-toggle").addEventListener("click", () => {
      if (!currentTrack?.video) return;

      audio.pause();
      video.src = currentTrack.video;
      video.load();
      $("#video-wrap").classList.add("visible");
      video.play().catch(() => {});
      $("#video-wrap").scrollIntoView({ behavior: "smooth", block: "center" });
    });

    audio.addEventListener("play", () => setPlayButtons(true));
    audio.addEventListener("pause", () => setPlayButtons(false));
    audio.addEventListener("ended", () => setPlayButtons(false));

    video.addEventListener("play", () => setPlayButtons(false));

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        $("#progress").value = Math.round(audio.currentTime / audio.duration * 1000);
      }
    });

    $("#progress").addEventListener("input", event => {
      if (audio.duration) {
        audio.currentTime = Number(event.target.value) / 1000 * audio.duration;
      }
    });

    fetch("playlist.json")
      .then(response => {
        if (!response.ok) throw new Error("Не удалось загрузить playlist.json");
        return response.json();
      })
      .then(renderPlaylist)
      .catch(error => {
        $("#playlist-title").textContent = "Не удалось загрузить плейлист";
        $("#error-message").textContent =
          error.message + ". Проверь, что playlist.json находится рядом с index.html.";
      });
  </script>
</body>
</html>
